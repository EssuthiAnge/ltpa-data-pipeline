services:
  postgres:
    image: postgres:17
    container_name: db_ltpa_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_ltpa
      POSTGRES_PASSWORD: password_ltpa
      POSTGRES_DB: ltpa_simulation
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
